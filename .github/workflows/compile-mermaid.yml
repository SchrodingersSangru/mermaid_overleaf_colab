name: Compile Mermaid Diagrams to PNG

on:
  push:
    paths:
      - 'diagrams/**.mmd' # Triggers when any .mmd file is modified
  workflow_dispatch:      # Allows manual run from GitHub UI

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Create generated output directory
        run: mkdir -p generated

      - name: Compile all .mmd files to high-res PNG
        run: |
          for file in diagrams/*.mmd; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .mmd)
              echo "Compiling $file to generated/${filename}.png"
              # -s 3 sets 3x scale factor for crisp PNG rendering
              mmdc -i "$file" -o "generated/${filename}.png" -p puppeteer-config.json -b transparent -s 3
            fi
          done

      - name: Commit and push generated PNGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/*.png
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes in generated PNG files."
          else
            git commit -m "chore: auto-compile updated mermaid diagrams to high-res PNGs [skip ci]"
            git push
          fi